sters\":0,\"requesters\":[],\"isCommentsDisabled\":false,\"isCollapsedForViewer\":false,\"isModerationLocked\":false,\"moderationCollapseTypeUrl\":null,\"network\":{\"id\":\"TmV0d29yazow\",\"__typename\":\"Network\",\"contentLanguageCode\":\"en\",\"appealsFormUrl\":\"https://help.quora.com/hc/en/requests/new?ticket_form_id=198746\"},\"collapseOperation\":null,\"numDisplayComments\":13,\"__isReportable\":\"Answer\",\"reportableId\":84580939,\"canViewerReport\":false,\"viewerVoteType\":\"novote\",\"adBrandSafetyRiskLevel\":\"low_risk\"}},\"cursor\":\"0\",\"id\":\"UXVlc3Rpb25QYWdlZExpc3RFZGdlOjA=\"},{\"node\":{\"__typename\":\"QuestionAnswerItem2\",\"id\":\"UXVlc3Rpb25BbnN3ZXJJdGVtMkAwOjkwMDU2OTY6YW5zd2VyOjI0NjY3MTI1\",\"__isQuestionPagedListItem\":\"QuestionAnswerItem2\",\"question\":{\"qid\":9005696,\"id\":\"UXVlc3Rpb25AMDo5MDA1Njk2\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Will AI replace architects in the next 20 years?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\"},\"index\":1,\"answer\":{\"id\":\"QW5zd2VyQDA6MjQ2NjcxMjU=\",\"aid\":24667125,\"isDeleted\":false,\"isMachineAnswer\":false,\"content\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"AI will not replace architects any time soon but will (and arguably already does) assist them.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Architecture is perhaps the most complex discipline operating in more dimensions than any other coordinated human activity. AI has only just succeeded at beating one of the top human Go players. While Go is perhaps the most complex pure strategy game we have (I am about an amateur 10 kyu player) it is very simple compared to the practice of architecture.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Similarly complex activities are economics and politics. These are complex as they have to do with the interactions of large numbers of people and organizations with complex, overlapping, and competing interests. Large scale architecture combines the complexities of economics and politics with the added complexity of having to actually produce a physical product at the end of the process.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"It seems to me it will be a long time before we see AI replacing politicians and economists. Replacing architects would be more difficult.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"There is also the question of motivation. We don't see development of AI novelists, musicians, playwrites, poets, painters, and so on since these are practices humans especially enjoy and are (so far) uniquely qualified to do. This is typical of all creative fields. The creators will accept computers and software that assists them but not ones that will replace them and the consumers are largely interested in the creative products of other humans. Purely automated creative works are, at least so far, novelty acts and products and the artist is still taken to be the human that created the automated process.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Furthermore, architecture is a massively collaborative process requiring the involvement of a wide range of professions and stakeholders. The role of the architect is to coordinate all of these so as to result in a completed building. We will likely see AI involvement at the level of the various disciplines such as structural, electrical, mechanical, etc engineering long before we see it for architecture. Even in those much more constrained and precise fields it will take quite some time to see true AI assistance let alone replacement. We are not likely to see AI architects until all the other disciplines are fully automated.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Realistically I expect we will see AI emerge in a supporting role, probably merging with game technology, to assist all the human participants at various levels and stages of the process. In time we may see full intelligence arise as an emergent property of the most advanced systems. At that point the AI beings will simply be participants in the collaborative process.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Given all of the above I expect that architects will be replaced by AI around the same time we have replaced ourselves with fully non-biological and/or hybrid (android, cyborg, etc) descendants.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"questionPageImpressionHash\":\"answer_ranking|-1529088719\",\"viewerHasAccess\":true,\"feedbackSurveyVariant\":0,\"tribeItem\":null,\"__typename\":\"Answer\",\"viewHash\":\"a-24667125_590bb7ef17dbb529750a496abb48569e\",\"isSelectedForDigestClickthroughSurvey\":false,\"question\":{\"qid\":9005696,\"id\":\"UXVlc3Rpb25AMDo5MDA1Njk2\",\"isDeleted\":false,\"url\":\"/Will-AI-replace-architects-in-the-next-20-years\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Will AI replace architects in the next 20 years?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"  of architectural design, such as drafting, modeling, and even generating design options based on specific parameters. Tools like generative design software can help architects explore a wider range of design possibilities more quickly.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"2. \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Enhanced Design Capabilities\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"AI can assist architects by providing data-driven insights, analyzing environmental impacts, and optimizing building performance. This can lead to more innovative and sustainable designs, but architects will still play a crucial role in making creative decisions and understanding client needs.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"3. \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Human-Centric Design\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Architecture is not just about creating functional spaces; it also involves understanding human behavior, culture, and aesthetics. Architects bring a unique perspective that combines technical knowledge with creativity and empathy, which is difficult for AI to replicate fully.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"4. \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Collaboration and Interdisciplinary Work\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The role of architects often involves collaboration with engineers, urban planners, and clients. AI can facilitate this collaboration by providing tools for communication and visualization, but the interpersonal skills and negotiation abilities of architects will remain essential.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"5. \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Job Evolution\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Rather than outright replacement, the role of architects may evolve. Architects may spend less time on technical tasks and more on strategic thinking, project management, and client interaction. This shift could lead to new job opportunities and roles that integrate AI technologies.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Conclusion\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In summary, while AI will transform the architectural profession by automating certain tasks and enhancing design processes, it is unlikely to fully replace architects within the next 20 years. Instead, architects will likely adapt to new tools and technologies, focusing more on the creative and human aspects of their work.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"questionPageImpressionHash\":\"answer_ranking|-78770952\",\"viewerHasAcc indow.ansFrontendGlobals.data.inlineQueryResults.next || {};window.ansFrontendGlobals.data.inlineQueryResults.results["c7e78b3b7e6fd95d21ea5af6ebec19f2b8b8d8026cf3d18239304cc632b87e84"] = window.ansFrontendGlobals.data.inlineQueryResults.results["c7e78b3b7e6fd95d21ea5af6ebec19f2b8b8d8026cf3d18239304cc632b87e84"] || [];window.ansFrontendGlobals.data.inlineQueryResults.results["c7e78b3b7e6fd95d21ea5af6ebec19f2b8b8d8026cf3d18239304cc632b87e84"].push("{\"data\":{\"node\":{\"__typename\":\"QuestionRelevantAnswerItem2\",\"id\":\"UXVlc3Rpb25SZWxldmFudEFuc3dlckl0ZW0yQDA6OTAwNTY5NjphbnN3ZXI6MTA0ODI0Mjk5\",\"__isQuestionPagedListItem\":\"QuestionRelevantAnswerItem2\",\"question\":{\"qid\":9005696,\"id\":\"UXVlc3Rpb25AMDo5MDA1Njk2\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Will AI replace architects in the next 20 years?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"isQuestionDecanonActive\":true,\"areRelatedAnswersEnabled\":true},\"index\":3,\"isEquivalentAnswer\":true,\"relatedQuestion\":{\"qid\":36183676,\"id\":\"UXVlc3Rpb25AMDozNjE4MzY3Ng==\"},\"answer\":{\"originalQuestionIfDifferent\":null,\"id\":\"QW5zd2VyQDA6MTA0ODI0Mjk5\",\"aid\":104824299,\"isDeleted\":false,\"isMachineAnswer\":false,\"content\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"This question is essentially the same as ones that I as an engineer keep hearing over and over again, usually from people who don\\\\u2019t really understand the nature of the work involved. Whether that work is architecture, engineering, science, medicine, or other fields, the question is basically the same. People asking the question tend to be naive, thinking that computers (or AI) are somehow \\\\u201cpowerful\\\\u201d enough to replace people. When computers began to become more widespread decades ago, popular press made the same idiotic proclamations, that people will be replaced by computers and that computers will be able to do everything that people can do. What nonsense.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Computers are not autonomous beings that can think for themselves. They can only do what they are programmed to do. And they can only do the work based on the parameters or inputs that are given to them by human beings. Ever heard of the phrase \\\\u201cgarbage out, garbage out\\\\u201d? Well, that can happen with computers when they are given incorrect or bad programming or inputs because, basically, they are dumb. Humans are smart enough to know when others are giving them stupid instructions, but that is not the case with computers. Give computers stupid instructions and they will follow them to the letter. Garbage in, garbage out.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"This is true even for the so-called Artificial Intelligence. Those applications can only do the work programmed into them. In the case of AI, the programming involves what is known as \\\\u201ctraining\\\\u201d, where the AI software is fed with numerous \\\\u201clessons\\\\u201d, in this case, just many different types of solutions for the types of problems that the AI is being \\\\u201ctrained\\\\u201d to solve. But AI is very rigid and can only solve the specific types of problems that it was trained to solve. It cannot, for example, think for itself and do many creative tasks that humans can do. For example, architects and engineers need to talk with their customers and interview them to learn about the customers\\\\u2019 needs and desires, and then think creatively to come up with designs that meet the customers\\\\u2019 needs. AI can\\\\u2019t do that because AI can only rigidly perform what they were \\\\u201ctrained\\\\u201d to do. Even with the training, AI can fail spectacularly in outlier cases, cases that fall far outside the norm or average of the \\\\u201clessons\\\\u201d that were used to train the AI. Because of that, AI results often need to be assessed and validated by humans. So much for AI replacing humans.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"There is a lot of creative process involved in the work that architects, engineers, scientists, and doctors perform. That requires a lot of independent thinking and ability to communicate with and understand other people. Sometimes, emotional needs may need to be addressed as well. Humans are also very good at knowing how to deal with unexpected or very different situations. Computers can\\\\u2019t do any of that. They can only rigidly follow instructions given to them by humans.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"So the answer to your question is, no, I don\\\\u2019t think architects (or other human experts like engineers, doctors, etc.) will ever be replaced by computers.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"questionPageImpressionHash\":\"answer_ranking|-1261422758\",\"viewerHasAccess\":true,\"feedbackSurveyVariant\":0,\"tribeItem\":null,\"__typename\":\"Answer\",\"viewHash\":\"a-104824299_78f4af85c5103418135c6eba03000002\",\"isSelectedForDigestClickthroughSurvey\":false,\"question\":{\"qid\":36183676,\"id\":\"UXVlc3Rpb25AMDozNjE4MzY3Ng==\",\"isDeleted\":false,\"url\":\"/Will-architects-ever-be-replaced-by-computers\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Will architects ever be replaced by computers?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\
