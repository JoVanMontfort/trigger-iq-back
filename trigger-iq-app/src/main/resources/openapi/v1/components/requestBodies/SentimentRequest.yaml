description: Sentiment submission payload
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        score:
          type: number
          format: float
          example: 0.75
        magnitude:
          type: number
          format: float
          example: 0.8
        label:
          type: string
          enum: [positive, neutral, negative]
          example: 'positive'
        source:
          type: string
          example: 'feedback_form'
        origin:
          type: string
          enum: [user, system]
          example: 'user'
        isUserSubmitted:
          type: boolean
          example: true
