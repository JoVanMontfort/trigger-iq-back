# application:
reddit:
  client-id: ${REDDIT_CLIENT_ID}
  client-secret: ${REDDIT_CLIENT_SECRET}
  username: ${REDDIT_USERNAME}
  password: ${REDDIT_PASSWORD}
  user-agent: ${REDDIT_USER_AGENT}
  default:
    limit: 40
    min-upvotes: 1
    keywords: Trump,Biden
    authors: elonmusk
    date-from: "2024-01-01T00:00:00Z"
    date-to: "2025-12-31T23:59:59Z"

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: reddit-archive

trainer:
  weka:
    maxWords: 1500
    tfTransform: true
    idfTransform: true