    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  cache:
    type: redis
    redis:
      host: localhost
      port: 6379
      password: # Optional, if you have authentication set up for Redis
      timeout: 10000  # Timeout in milliseconds
